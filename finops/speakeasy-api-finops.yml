description: >-
  FinOps view of Speakeasy spend. Speakeasy is a developer-tool platform billed on
  a per-language license model rather than on API request or data-transfer volume.
  A Free tier covers one language and up to 250 operations at no cost. The Business
  tier is a flat 720 USD per month per licensed language (600 USD per month billed
  annually), and each licensed language may generate any number of SDKs sharing one
  250-operation limit. Enterprise is custom-priced. The dominant cost drivers are
  therefore the number of licensed languages and whether you exceed the per-language
  operation allowance, not runtime API traffic.
notes: >-
  Business per-language pricing (720 USD/mo; 600 USD/mo annual) and the Free tier
  (one language, 250 operations) are grounded to the pricing page as of the review
  date. Enterprise and MCP / AI Control Plane pricing is custom. Verify current
  rates on the Speakeasy pricing page during reconciliation.
