meters:
- name: language_licenses
  description: Number of languages licensed on the Business tier, billed 720 USD/mo each (600 USD/mo annual).
  unit: languages
  aggregation: sum
  dimensions:
  - account
  - language
- name: operations_per_language
  description: API operations generated per licensed language; each language includes a 250-operation allowance.
  unit: operations
  aggregation: max
  dimensions:
  - account
  - language
- name: enterprise_contract
  description: Custom Enterprise or MCP / AI Control Plane agreement, negotiated.
  unit: contract
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track how many languages are licensed and how many operations each language's SDKs cover against the 250-operation allowance.
- name: Allocation
  description: Map language licenses to the product teams or public SDKs that depend on them.
- name: Optimization
  description: Consolidate SDKs within a licensed language (they share one operation limit) and prune unused operations from the OpenAPI spec to stay within allowances; use the Free tier for a single-language SDK.
- name: Accountability
  description: Assign an owner per licensed language and review monthly whether each license and its operation count is still justified.
