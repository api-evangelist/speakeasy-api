aid: speakeasy-api
url: https://raw.githubusercontent.com/api-evangelist/speakeasy-api/refs/heads/main/apis.yml
name: Speakeasy
kind: company
description: Speakeasy is an API developer-experience platform that generates production-ready,
  type-safe SDKs (client libraries), Terraform providers, MCP servers, CLIs, code
  samples, and docs from an OpenAPI specification. The primary interface is the
  Speakeasy CLI plus GitHub Actions and the hosted platform, but Speakeasy also
  exposes a documented public REST API at https://api.prod.speakeasy.com that backs
  the CLI and platform - covering the OpenAPI/artifact registry, workspaces and
  organizations, schema store, code samples, generation events, lint/change reports,
  GitHub automation, LLM-powered OpenAPI suggestions, and SDK publishing tokens. It
  is OpenAPI-native with no proprietary DSL, targeting API design, API lifecycle,
  and SDK/client-library generation use cases.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- API Lifecycle
- SDK Generation
- Client Library
- API Design
- Developer Tools
- OpenAPI
- Code Generation
- Terraform
- MCP
- Developer Experience
created: '2026-07-11'
modified: '2026-07-11'
