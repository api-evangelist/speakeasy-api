  endpointsModeledNote: |
    The published Speakeasy OpenAPI (speakeasy.com/openapi.yaml) defines roughly
    65 REST operations across Auth, Events, Reports, Github, Suggest, ShortURLs,
    Workspaces, Organizations, CodeSamples, Artifacts, SchemaStore,
    PublishingTokens, and Subscriptions. The list above is a representative subset;
    the full set is captured verbatim in openapi/speakeasy-api-openapi.yaml, which
    is copied directly from Speakeasy's published document (not hand-modeled).
sources:
  - url: https://www.speakeasy.com/openapi.yaml
    type: OpenAPI
    note: Published Speakeasy API OpenAPI 3.0.3 (title "Speakeasy API", v0.4.0), server https://api.prod.speakeasy.com. All REST; no WebSocket.
  - url: https://www.speakeasy.com/docs
    type: Documentation
    note: Platform docs - CLI, GitHub Action, SDK generation, Terraform, MCP, API registry.
  - url: https://www.speakeasy.com/guides/openapi/publish-specs-to-api-registry
    type: Documentation
    note: API registry / artifacts workflow via CLI and API.
  - url: https://github.com/speakeasy-api/speakeasy
    type: SourceCode
    note: Open-source Speakeasy CLI - the primary interface to the platform.
  - url: https://github.com/speakeasy-api/sdk-generation-action
    type: SourceCode
    note: Speakeasy GitHub Action for SDK generation, release, and publishing.
  - url: https://www.speakeasy.com/pricing
    type: Pricing
    note: Free, Business ($720/mo, $600/mo annual, per language), and custom Enterprise tiers.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Speakeasy's own public API is
    request/response REST (the Speakeasy API at api.prod.speakeasy.com, with a
    published OpenAPI document) plus OCI-compatible artifact retrieval and a polled
    async job for code-sample previews. No AsyncAPI document was created because
    there is no server-push transport on Speakeasy's own API to model. The bulk of
    Speakeasy's value is delivered through the CLI and GitHub Action that generate
    SDKs and Terraform providers locally/in CI, with the REST API acting as the
    registry and control plane.
