aid: speakeasy-api
name: Speakeasy
review:
  question: Does Speakeasy expose a documented public WebSocket API?
  answer: false
  date: '2026-07-11'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Speakeasy's own public HTTP surface (the
    REST API at https://api.prod.speakeasy.com, described by a published OpenAPI
    3.0.3 document at https://www.speakeasy.com/openapi.yaml) is entirely
    request/response REST over HTTPS. There is no server-push transport
    (WebSocket or SSE) on Speakeasy's own API to model. The one long-running
    operation - async code-sample preview generation - is exposed as a polled
    job (POST a job, then GET the job by ID), not a streamed connection.
findings:
  summary: |
    Speakeasy does not publish a documented public WebSocket API. Speakeasy is an
    API developer-experience platform whose primary interfaces are the Speakeasy
    CLI, a GitHub Action, and the hosted web platform. Underneath those it also
    operates a documented public REST API at https://api.prod.speakeasy.com,
    described by a public OpenAPI 3.0.3 document (title "Speakeasy API", version
    0.4.0) at https://www.speakeasy.com/openapi.yaml. That REST API is pure
    request/response over HTTPS. Authentication is via an x-api-key workspace API
    key, an x-workspace-identifier header, or a Bearer token. No realtime,
    bidirectional, or streaming WebSocket (ws:// or wss://) endpoint is
    documented anywhere in the Speakeasy OpenAPI or docs as of the review date.
  accessModel: |
    Speakeasy is a developer-tool platform, not a hosted data API. Most day-to-day
    use is through the open-source Speakeasy CLI (github.com/speakeasy-api/speakeasy,
    installed via Homebrew/script/Winget/Chocolatey) and the Speakeasy GitHub
    Action (github.com/speakeasy-api/sdk-generation-action), which read an OpenAPI
    spec and generate/publish type-safe SDKs (client libraries), Terraform
    providers, MCP servers, CLIs, contract tests, code samples, and docs. The REST
    API at api.prod.speakeasy.com is the control plane those binaries call - it is
    a real, documented public API (OpenAPI published), covering the artifact/API
    registry, workspaces, organizations, schema store, code samples, generation
    events, lint/change reports, GitHub automation, LLM OpenAPI suggestions,
    publishing tokens, and event subscriptions. It is best understood as a
    platform/registry API rather than a general-purpose runtime data API.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.prod.speakeasy.com
      documented: true
      note: Speakeasy API, OpenAPI 3.0.3 published at speakeasy.com/openapi.yaml. All request/response.
    - protocol: OCI
      scheme: https
      baseURL: https://api.prod.speakeasy.com/v1/oci/v2
      documented: true
      note: OCI-compatible blob and manifest GET endpoints for pulling registry artifacts. Still request/response HTTPS.
    - protocol: Async Job (polled)
      scheme: https
      documented: true
      note: Code-sample preview async flow - POST /v1/code_sample/preview/async then GET /v1/code_sample/preview/async/{jobID}. Polled, not pushed.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the Speakeasy OpenAPI or docs as of the review date.
